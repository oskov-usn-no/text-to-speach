[project]
name = "text-to-speach"
version = "0.1.0"
description = "OCR screenshots to text, and read text aloud (Windows)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "pyttsx3>=2.98",
]

[project.scripts]
tts = "text_to_speach.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
